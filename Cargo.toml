[package]
name = "stego-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Experimental JPEG steganography core: password-protected records, decoy records and selectable cost models"
repository = "https://github.com/hobby-eng/stego-core"
license = "MIT OR Apache-2.0"
# Not published until the record format is frozen after the detectability measurements.
publish = false

# Exact versions (CORE-25); the reasons are in THIRD_PARTY_NOTICES.md.
[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = { version = "=0.10.2", default-features = false, features = [
  "cipher",
  "rng",
  "zeroize",
] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "=0.13.0"
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
vsss-rs = { version = "=6.0.1", default-features = false, features = ["std", "zeroize"] }
unicode-normalization = "=0.1.26"
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }

# Pages, locking, dump and fork advice, process protections and the secret writer (`os`, copied
# from mhfe_core).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# Pages, locking and the working set, error-report exclusion, the access lists of the process and
# its threads, token integrity and console output.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_ErrorReporting",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# Synthetic test photos only; no photo file is committed.
jpeg-encoder = "=0.7.1"
# An independent Reed–Solomon implementation: the expected parity of the shard tests.
reed-solomon-erasure = "=6.0.0"

[lints.rust]
unsafe_code = "deny" # not "forbid": the operating-system modules allow it (RUST-07)
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# The cost models and the trellis are slow without optimization even in tests.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# The tests read the working set of the secret pages (QueryWorkingSetEx).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus"] }
